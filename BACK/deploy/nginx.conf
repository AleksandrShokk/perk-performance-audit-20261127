# Example production ingress: replace perk.example.com and certificate paths before use.
# Only this ingress is public. Next and API ports must stay on the private network.
server {
  listen 443 ssl;
  server_name perk.example.com;
  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_key;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location /api/v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
