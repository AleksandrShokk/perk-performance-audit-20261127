[project]
name = "perk-backend"
version = "0.1.0"
description = "PERK marketplace analytics backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "python-multipart>=0.0.20,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "celery[redis]>=5.6,<6",
    "argon2-cffi>=25,<26",
    "cryptography>=46,<51",
    "pyotp>=2.9,<3",
    "email-validator>=2,<3",
    "redis>=6.4,<7",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "httpx2>=2.13.1",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the PERK PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
