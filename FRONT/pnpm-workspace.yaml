packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  unrs-resolver: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.15 || 58.1.19'
  - '@expo/config@58.0.8 || 58.0.11'
  - '@expo/local-build-cache-provider@58.0.8 || 58.0.11'
  - '@expo/metro-config@58.0.17 || 58.0.21'
  - '@expo/prebuild-config@58.0.16 || 58.0.19'
  - '@expo/router-server@58.0.17 || 58.0.21'
  - babel-preset-expo@58.0.20 || 58.0.24
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15 || 58.0.17
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26 || 58.0.30
  - expo-modules-jsi@58.0.19 || 58.0.22
  - expo-server@58.0.6
  - expo@58.0.19 || 58.0.23
  - '@expo/ui@58.0.23 || 58.0.27'
  - expo-glass-effect@58.0.5
  - expo-image@58.0.17
  - expo-router@58.0.26 || 58.0.30
  - '@expo/config-plugins@58.0.12'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/log-box@58.0.15'
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - '@expo/metro-runtime@58.0.17'
  - expo-linking@58.0.16
  - expo-sharing@58.0.22
  - expo-splash-screen@58.0.13

# Security fixes in build-tool dependencies; Expo SDK/native package versions stay pinned.
overrides:
  'glob@>=9.0.0 <14.0.2': 14.0.2
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'eslint-plugin-react-hooks>zod': 4.6.6
  'zod-validation-error>zod': 4.6.6
